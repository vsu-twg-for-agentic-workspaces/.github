<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Dark Pine to Forest Green) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062F1D" />
      <stop offset="50%" stop-color="#083D26" />
      <stop offset="100%" stop-color="#041E12" />
    </linearGradient>

    <!-- VSU Forest Green Border Gradient -->
    <linearGradient id="greenBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="35%" stop-color="#0D5C3A" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#083D26" />
    </linearGradient>

    <!-- Gold Gradients for Central Mark -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Protective Base Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- VSU Forest Green Outer Border (Replacing the former yellow border) -->
  <circle cx="256" cy="256" r="242" fill="none" stroke="url(#greenBorderGrad)" stroke-width="14" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#059669" stroke-width="2" opacity="0.6" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="#34D399" stroke-width="1" stroke-dasharray="6 4" opacity="0.4" />

  <!-- Geometric Circuit Accents (Agentic Network Grid) -->
  <g opacity="0.25" stroke="#34D399" stroke-width="1.5" fill="none">
    <path d="M 96 256 A 160 160 0 0 1 416 256 A 160 160 0 0 1 96 256" />
    <path d="M 56 256 H 100 M 412 256 H 456" />
    <path d="M 256 56 V 100 M 256 412 V 456" />
    <circle cx="256" cy="56" r="3.5" fill="#34D399" />
    <circle cx="256" cy="456" r="3.5" fill="#34D399" />
    <circle cx="56" cy="256" r="3.5" fill="#34D399" />
    <circle cx="456" cy="256" r="3.5" fill="#34D399" />
  </g>

  <!-- Central Inner Shield / Hex Core -->
  <polygon points="256,76 412,166 412,346 256,436 100,346 100,166" fill="#083D26" stroke="#0D5C3A" stroke-width="3" opacity="0.85" />

  <!-- Elliptical Agentic Workflow Orbits (Tilted 30 degrees) -->
  <ellipse cx="256" cy="256" rx="168" ry="72" fill="none" stroke="#F59E0B" stroke-width="2.5" transform="rotate(-30 256 256)" opacity="0.8" />
  <ellipse cx="256" cy="256" rx="168" ry="72" fill="none" stroke="#F59E0B" stroke-width="2.5" transform="rotate(30 256 256)" opacity="0.8" />

  <!-- Agentic Workflow Nodes (Perceive, Reason, Act, Reflect) -->
  <g filter="url(#glow)">
    <!-- Node Top-Right (Reason) -->
    <circle cx="376" cy="178" r="13" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="376" cy="178" r="5" fill="#083D26" />

    <!-- Node Bottom-Right (Act) -->
    <circle cx="376" cy="334" r="13" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="376" cy="334" r="5" fill="#083D26" />

    <!-- Node Bottom-Left (Reflect) -->
    <circle cx="136" cy="334" r="13" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="136" cy="334" r="5" fill="#083D26" />

    <!-- Node Top-Left (Perceive) -->
    <circle cx="136" cy="178" r="13" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="136" cy="178" r="5" fill="#083D26" />
  </g>

  <!-- Central Monument / Beacon of Truth & Intelligence -->
  <g id="central-beacon">
    <!-- Base Platform (3 stepped tiers) -->
    <rect x="200" y="348" width="112" height="9" rx="2.5" fill="url(#goldGrad)" />
    <rect x="214" y="339" width="84" height="9" rx="2" fill="#FEF08A" />
    <rect x="230" y="330" width="52" height="9" rx="1.5" fill="url(#goldGrad)" />

    <!-- Left Obelisk (Human Intuition, Nature & Agriculture) -->
    <polygon points="232,330 236,142 245,126 248,330" fill="url(#goldLight)" />
    <polygon points="248,330 245,126 250,142 250,330" fill="#D97706" />

    <!-- Right Obelisk (Agentic Machine Intelligence, Science & Tech) -->
    <polygon points="264,330 262,142 267,126 280,330" fill="url(#goldLight)" />
    <polygon points="262,330 262,142 267,126 264,330" fill="#D97706" />

    <!-- Central SFT Spark / Guiding Flame of Truth -->
    <path d="M 256 106 Q 263 122 268 134 Q 256 144 256 156 Q 256 144 244 134 Q 249 122 256 106 Z" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="256" cy="132" r="4" fill="#F59E0B" />
  </g>

  <!-- Synaptic Connectors from Core to Nodes -->
  <g stroke="#34D399" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.75">
    <line x1="256" y1="156" x2="376" y2="178" />
    <line x1="256" y1="256" x2="376" y2="334" />
    <line x1="256" y1="256" x2="136" y2="334" />
    <line x1="256" y1="156" x2="136" y2="178" />
  </g>

  <!-- Cardinal Node Accents on Green Rim -->
  <circle cx="256" cy="14" r="5" fill="#34D399" />
  <circle cx="256" cy="498" r="5" fill="#34D399" />
  <circle cx="14" cy="256" r="5" fill="#34D399" />
  <circle cx="498" cy="256" r="5" fill="#34D399" />
</svg>